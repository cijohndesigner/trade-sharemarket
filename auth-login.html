
<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#7c3aed">
  <title>Sign In | CJ Cruz Trade Tracker</title>
  <link rel="stylesheet" href="css/auth-glass.css">
</head>
<body class="auth-page">
  <div class="auth-orb one" aria-hidden="true"></div>
  <div class="auth-orb two" aria-hidden="true"></div>

  <main class="auth-wrap">
    <div class="auth-brand">
      <div class="auth-logo">CJ</div>
      <div>
        <div class="auth-brand-name">CJ Cruz Trade Tracker</div>
        <div class="auth-brand-sub">
          Your personal trading workspace
        </div>
      </div>
    </div>

    <section class="auth-card">
      <span class="auth-eyebrow">✦ Member sign in</span>
      <h1>Welcome back</h1>
      <p class="auth-intro">
        Sign in to access your personal trading workspace.
      </p>

      <div class="auth-message"
           data-auth-message
           role="status"
           aria-live="polite"></div>

      <form data-auth-form>
        <label class="auth-field">
          <span>Username</span>
          <input
            class="auth-input"
            type="text"
            name="username"
            placeholder="Enter your username"
            autocomplete="username"
            minlength="3"
            maxlength="32"
            required>
        </label>

        <label class="auth-field">
          <span>Password</span>
          <input
            class="auth-input"
            type="password"
            name="password"
            placeholder="Enter your password"
            autocomplete="current-password"
            required>
        </label>

        <div class="auth-options">
          <a class="auth-link"
             href="auth-forgot-password.html">
            Forgot password?
          </a>
        </div>

        <button class="auth-submit" type="submit">
          Login →
        </button>
      </form>

      <p class="auth-switch">
        Don't have an account?
        <a class="auth-link" href="auth-signup.html">
          Create account
        </a>
      </p>

      <div class="auth-admin-link">
        <a class="auth-link" href="admin-members.html">
          Admin Login
        </a>
      </div>
    </section>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/supabase-config.js"></script>
  <script src="js/auth-pages.js" defer></script>
</body>
</html>
