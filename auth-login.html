
<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#7c3aed">
  <title>Set New Password | CJ Cruz Trade Tracker</title>
  <link rel="stylesheet" href="css/auth-glass.css">
</head>
<body class="auth-page">
  <div class="auth-orb one" aria-hidden="true"></div>
  <div class="auth-orb two" aria-hidden="true"></div>

  <main class="auth-wrap">
    <div class="auth-brand">
      <div class="auth-logo">CJ</div>
      <div>
        <div class="auth-brand-name">CJ Cruz Trade Tracker</div>
        <div class="auth-brand-sub">Your personal trading workspace</div>
      </div>
    </div>

    <section class="auth-card">
      <span class="auth-eyebrow">✦ Account recovery</span>
      <h1>Set a new password</h1>
      <p class="auth-intro">
        Enter and confirm your new password below.
      </p>

      <div class="auth-message" data-auth-message role="status"></div>

      <form data-auth-form>
        <label class="auth-field">
          <span>New password</span>
          <input class="auth-input" type="password"
            name="password" autocomplete="new-password"
            minlength="10" required>
        </label>

        <label class="auth-field">
          <span>Confirm new password</span>
          <input class="auth-input" type="password"
            name="confirmPassword" autocomplete="new-password"
            minlength="10" required>
        </label>

        <button class="auth-submit" type="submit">
          Update password →
        </button>
      </form>

      <p class="auth-switch">
        <a class="auth-link" href="auth-login.html">Back to sign in</a>
      </p>
    </section>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/supabase-config.js"></script>
  <script src="js/auth-pages.js" defer></script>
</body>
</html>
